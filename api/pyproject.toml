[project]
name = "borer-api"
version = "0.0.1"
description = "HaBorer local API (Phase 2A): FastAPI + SQLite around borer_sim"
requires-python = ">=3.12,<3.13"
# borer_sim (../sim/src) runs in this env: its libraries are pinned to sim/uv.lock so
# hearings match the validated results bit for bit (same platform).
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "torch==2.14.1",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "websockets>=17.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src", "../sim/src"]
testpaths = ["tests"]
markers = ["needs_data: requires the FlyWire v783 raw files in sim/data/raw/",
           "chrome: page tests in headless Chrome (run with -m chrome)"]
addopts = "-m 'not chrome'"
