<meta name="color-scheme" content="light dark">
<script>
// Day or night court before the first paint (same rule as js/theme.js).
(function () {
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem("theme")); } catch (e) {}
  document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
})();
</script>
